# Provider on/off mask — read fresh every request, no restart. Per-request
# [AVAILABLE:]/[UNAVAILABLE:] tags override.
#
# This file costs NOTHING to list a provider in: load_availability() is a local YAML read,
# never a network call. It is not the health probe. (scripts/nim_health.sh is the thing that
# spends tokens, and that one deliberately probes FREE aliases only — a flat/paid subscription
# that authenticates works, so probing it buys no information.)
#
# Every provider in PRIORITY_CHAIN defaults to available:true, so an absent entry is still ON.
# Listing them all anyway gives you one place to flip any backend off by hand.
providers:
  nim:
    available: true
    note: "NVIDIA NIM — free workhorse; load-variable, so latency-gated by model_health.yaml"
  mistral:
    available: true
    note: "Mistral free tier — mist-* aliases (api.mistral.ai)"
  zen:
    available: true
    note: "opencode Zen — GO flat-rate (class 1) + free tier ($0) + per-token paid backstop (class 4)"
  zai:
    available: true
    note: "z.ai GLM Coding Plan — flat-rate (class 2); Anthropic-compat endpoint only"
  anthropic:
    available: true
    note: "Claude Max OAuth — flat-rate subscription; ant-* aliases; proxy on :4041"
  codex:
    available: true
    note: "Codex/ChatGPT subscription — flat-rate; cod-* aliases; proxy on :4042"
  copilot:
    available: false   # 402 credits exhausted 2026-07-07 — restore on monthly reset
    note: "GitHub Copilot — per-request credit; frontier / last resort"
