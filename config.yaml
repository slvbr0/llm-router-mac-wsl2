    litellm_params: {model: openai/mimo-v2.5, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}   # 30,100/5h — the most generous capable GO model
  - model_name: go-hy3
    litellm_params: {model: openai/hy3, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}         # 4,300/5h — replaces the retired hy3-free
  - model_name: go-luna
    litellm_params: {model: openai/gpt-5.6-luna, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY} # 2,050/5h — same model as cod-luna, but GO(1) is spent before Codex(2), so this wins
  - model_name: go-minimax27
    litellm_params: {model: openai/minimax-m2.7, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}  # 3,400/5h
  - model_name: go-qwen36
    litellm_params: {model: openai/qwen3.6-plus, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}  # 3,300/5h — reasoner
