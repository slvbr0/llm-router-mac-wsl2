  #   deepseek-v4-flash 31,650 · mimo-v2.5 30,100 · qwen3.7-plus 4,300 · hy3 4,300
  #   · deepseek-v4-pro 3,450 · mimo-v2.5-pro 3,250 · minimax-m3 3,200 · gpt-5.6-luna 2,050
