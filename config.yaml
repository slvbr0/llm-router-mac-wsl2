# LiteLLM proxy config — llm-router mac v1
# Aliases are STABLE; underlying model IDs re-verified at build (Task 8).
# Priority: NIM (free, when responsive) -> Zen (per-token) -> Copilot (per-request).

model_list:
  # ===== NVIDIA NIM (free-tier workhorse) =====
  - model_name: nim-glm
    litellm_params: {model: openai/z-ai/glm-5.2, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-deepseek
    litellm_params: {model: openai/deepseek-ai/deepseek-v4-pro, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-deepseek-flash
    litellm_params: {model: openai/deepseek-ai/deepseek-v4-flash, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  # nim-qwen-max / nim-qwen removed 2026-07-29: NVIDIA delisted the ENTIRE Qwen family (HTTP 410;
  # zero qwen/* entries remain in /v1/models). nim-inkling + nim-gptoss replace that capacity.
  - model_name: nim-inkling
    litellm_params: {model: openai/thinkingmachines/inkling, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}  # ~0.9s, tool-capable (verified)
  - model_name: nim-gptoss
    litellm_params: {model: openai/openai/gpt-oss-20b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}  # ~2.4s, tool-capable (verified)
  - model_name: nim-minimax
    litellm_params: {model: openai/minimaxai/minimax-m3, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-nemotron
    litellm_params: {model: openai/nvidia/nemotron-3-ultra-550b-a55b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-nemotron-super
    litellm_params: {model: openai/nvidia/nemotron-3-super-120b-a12b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  # nim-mistral removed 2026-07-29: mistral-large-3 delisted (HTTP 410). The remaining NIM mistral
  # builds are either not provisioned for this account (404) or >90s (mistral-medium-3.5-128b).
  # Mistral proper is still available via the mis-* aliases on api.mistral.ai.
  - model_name: nim-llama
    litellm_params: {model: openai/meta/llama-3.3-70b-instruct, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-step
    litellm_params: {model: openai/stepfun-ai/step-3.7-flash, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}  # sparse-MoE reasoning, tool-capable, ~1.2s, reasons NATIVELY (no param)

  # ===== Mistral free tier (LiteLLM native mistral/ -> api.mistral.ai/v1) =====
  # Capable models only (per policy: no ministral/tiny/nemo). large+codestral = non-reasoning;
  # medium+magistral = reason natively (no param — magistral reasons inline). Cost class 0 (free).
  - model_name: mis-large
    litellm_params: {model: mistral/mistral-large-latest, api_key: os.environ/MISTRAL_API_KEY}
  - model_name: mis-codestral
    litellm_params: {model: mistral/codestral-latest, api_key: os.environ/MISTRAL_API_KEY}
  - model_name: mis-medium
    litellm_params: {model: mistral/mistral-medium-latest, api_key: os.environ/MISTRAL_API_KEY}
  - model_name: mis-magistral
    litellm_params: {model: mistral/magistral-small-latest, api_key: os.environ/MISTRAL_API_KEY}

  # ===== z.ai GLM Coding Plan (flat-rate) — Anthropic-compat endpoint ONLY =====
  # The plan key 429s on the OpenAI /paas/v4 lane ("insufficient balance"); it works only via
  # /api/anthropic, so these use LiteLLM's anthropic/ provider (x-api-key + /v1/messages). Cost
  # cost class 4 — the LAST flat lane, after GO(1)/Codex(2)/Anthropic(3). zai-52/51 take the
  # Anthropic thinking block.
  # zai-flash = glm-4.7 (asking glm-4.5-air on this endpoint silently serves glm-4.7).
  - model_name: zai-turbo
    litellm_params: {model: anthropic/glm-5-turbo, api_base: https://api.z.ai/api/anthropic, api_key: os.environ/ZAI_API_KEY}
  - model_name: zai-52
    litellm_params: {model: anthropic/glm-5.2, api_base: https://api.z.ai/api/anthropic, api_key: os.environ/ZAI_API_KEY}
  - model_name: zai-51
    litellm_params: {model: anthropic/glm-5.1, api_base: https://api.z.ai/api/anthropic, api_key: os.environ/ZAI_API_KEY}
  - model_name: zai-flash
    litellm_params: {model: anthropic/glm-4.7, api_base: https://api.z.ai/api/anthropic, api_key: os.environ/ZAI_API_KEY}

  # ===== Codex / ChatGPT subscription (flat-rate) via providers/codex_oauth_proxy.py =====
  # The subscription serves GPT ONLY through chatgpt.com/backend-api/codex/responses (Responses
  # API, stream-only). api.openai.com 401s (missing scope) / 429s (no PAYG balance), so the local
  # proxy on :4042 translates chat/completions <-> Responses. Cost class 2 — spent after opencode
  # GO (1) but before Claude Max (3). Fills a real gap: zen-gpt 401s and co-gpt fails via LiteLLM's Copilot path,
  # so this is the only working GPT lane. Tool-calling verified live.
  - model_name: cod-mini
    litellm_params: {model: openai/gpt-5.4-mini, api_base: http://host.docker.internal:4042/v1, api_key: os.environ/LITELLM_MASTER_KEY}   # ~1.1s, smallest quota burn, tool-capable
  - model_name: cod-luna
    litellm_params: {model: openai/gpt-5.6-luna, api_base: http://host.docker.internal:4042/v1, api_key: os.environ/LITELLM_MASTER_KEY}   # ~0.9s, fastest
  - model_name: cod-terra
    litellm_params: {model: openai/gpt-5.6-terra, api_base: http://host.docker.internal:4042/v1, api_key: os.environ/LITELLM_MASTER_KEY}  # ~1.0s, mid
  - model_name: cod-sol
    litellm_params: {model: openai/gpt-5.6-sol, api_base: http://host.docker.internal:4042/v1, api_key: os.environ/LITELLM_MASTER_KEY}    # ~2.8s, strongest; takes reasoning_effort

  # ===== opencode Zen (per-token; conserve). IDs verified at build (Task 8). =====
  - model_name: zen-gpt
    litellm_params: {model: openai/gpt-5.5, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  # Frontier Claude via Zen per-token credits (the LEGITIMATE lane — no client spoofing).
  # Needs a Zen credits balance; 401 until topped up, fallbacks cover it.
  - model_name: zen-fable
    litellm_params: {model: openai/claude-fable-5, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-opus
    litellm_params: {model: openai/claude-opus-4-8, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: go-glm
    litellm_params: {model: openai/glm-5.2, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: go-deepseek
    litellm_params: {model: openai/deepseek-v4-pro, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  # ===== opencode GO subscription (flat-rate plan, /zen/go/v1 — NOT per-token credits) =====
