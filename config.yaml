  - model_name: co-mini
    litellm_params: {model: github_copilot/gpt-5.4-mini}

  # Router entry point — priority_router rewrites per request.
  - model_name: auto
    litellm_params: {model: openai/z-ai/glm-5.2, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}

# Native LiteLLM fallbacks (deployment error/rate-limit): cost-ordered NIM -> Zen -> Copilot.
router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  num_retries: 1              # was 2: each retry RE-SENDS the full prompt to the SAME (often
                              # rate-limited) model before falling back — billed a 63k-token brain
                              # call up to 3x. 1 keeps a transient-blip retry; a 429 falls back fast.
  timeout: 600                # reasoning models on huge contexts think LONG before streaming
  stream_timeout: 600         # never kill a stream mid-think (wait-it-out rule)
  # COMPLETE fallback map — EVERY model group has a chain (mid-stream failures on an
  # unlisted group hard-error instead of falling back; learned live on free-nemotron).
  # Order per chain (marginal-cost cascade): free (NIM/Mistral/free-*) -> GO flat -> Codex flat
  # -> Anthropic Max flat -> PAID zen twin (last resort) -> copilot. Free ALWAYS before paid.
  fallbacks:
    # Mistral free -> peer Mistral -> free NIM -> GO -> z.ai -> copilot (cost-ordered).
    - mis-large: [mis-medium, mis-codestral, nim-inkling, cod-terra, go-glm, zai-turbo, co-sonnet]
    - mis-codestral: [mis-large, nim-deepseek, cod-terra, go-kimi, zai-turbo, co-sonnet]
    - mis-medium: [mis-magistral, mis-large, nim-glm, cod-sol, go-glm, ant-sonnet, zai-52]
    - mis-magistral: [mis-medium, nim-glm, cod-sol, go-glm, ant-sonnet, zai-52]
    # z.ai flat -> free first -> GO -> Anthropic -> peer z.ai -> copilot (cost-ordered).
    - zai-turbo: [mis-large, cod-terra, go-glm, go-kimi, zai-flash, co-sonnet]
    - zai-flash: [mis-codestral, cod-terra, go-glm, zai-turbo, co-sonnet]
    - zai-52: [mis-medium, cod-sol, go-glm, go-qwen-max, ant-sonnet, zai-51, co-opus]
    - zai-51: [mis-medium, cod-sol, go-glm, go-qwen-max, ant-sonnet, zai-52, co-opus]
    - nim-glm: [nim-inkling, free-nemotron, cod-terra, go-glm, co-sonnet]
    - nim-inkling: [nim-gptoss, nim-glm, free-nemotron, cod-terra, go-glm, co-sonnet]
    - nim-gptoss: [nim-inkling, nim-glm, free-nemotron, cod-terra, go-glm, co-sonnet]
    - nim-deepseek: [nim-gptoss, nim-deepseek-flash, cod-terra, go-deepseek, co-sonnet]
    - nim-nemotron: [nim-nemotron-super, nim-inkling, cod-sol, go-qwen-max, co-opus]
    - nim-nemotron-super: [nim-nemotron, nim-inkling, cod-sol, go-qwen-max, co-opus]
    - nim-minimax: [nim-glm, nim-deepseek, cod-terra, go-minimax, co-sonnet]
    - nim-llama: [nim-deepseek-flash, free-deepseek, cod-luna, go-deepseek-flash, co-haiku]
    - nim-step: [nim-glm, nim-deepseek, free-north, cod-terra, go-glm, co-sonnet]
    - nim-deepseek-flash: [nim-llama, free-deepseek, cod-luna, go-deepseek-flash, co-haiku]
    - free-nemotron: [nim-glm, nim-inkling, cod-terra, go-glm, co-sonnet]
    - free-deepseek: [nim-deepseek-flash, nim-llama, cod-luna, go-deepseek-flash, co-haiku]
    - free-pickle: [free-deepseek, nim-llama, cod-luna, co-haiku]
    # GO flat models overflow FREE-FIRST. A GO 429 means the whole GO plan is saturated, so other
    # GO peers are useless — skip them. Order: free NIM/Mistral -> z.ai flat -> Anthropic Max flat
    # -> PAID twin (LAST, only if every free/flat option is down) -> copilot. Paid is NEVER reached
    # before free/flat capacity (that was billing 63k-token calls at ~$0.22 each on a saturated GO).
    - go-glm: [nim-glm, mis-large, cod-terra, ant-sonnet, zai-turbo, zen-glm, co-sonnet]
    - go-deepseek: [nim-deepseek, nim-glm, cod-terra, ant-sonnet, zai-turbo, co-sonnet]
    - go-deepseek-flash: [free-deepseek, nim-deepseek-flash, nim-llama, cod-luna, zai-flash, co-haiku]
    - go-kimi: [nim-deepseek, nim-glm, cod-terra, ant-sonnet, zai-turbo, co-sonnet]
    - go-minimax: [nim-minimax, nim-glm, cod-terra, ant-sonnet, zai-turbo, zen-minimax, co-sonnet]
    - go-qwen-max: [nim-nemotron, nim-glm, cod-sol, ant-sonnet, zai-52, zen-qwen-max, co-opus]
    - go-mimo: [nim-glm, mis-large, cod-terra, ant-sonnet, zai-turbo, co-sonnet]
    - go-qwen-plus: [nim-inkling, nim-glm, cod-sol, ant-sonnet, zai-52, zen-qwen-plus, co-opus]
    # Orchestrator brains (low quota): a 429 degrades FREE-FIRST (free reasoner) -> Anthropic Max
    # (quality flat) -> z.ai flat -> PAID twin LAST RESORT -> copilot. Previously paid was 1st/2nd
    # here — that is exactly what billed the 63k brain calls. grok/kimi-k3 skip each other (both
    # low-quota) and skip GO peers entirely (GO is saturated when the brain 429s).
    - go-kimi-k3: [nim-glm, mis-medium, cod-sol, ant-opus, ant-sonnet, zai-52, zen-kimi3, co-opus]
    - go-grok: [nim-glm, mis-medium, cod-sol, ant-opus, ant-sonnet, zai-52, zen-grok, co-opus]
    # PAID per-token overflow chains ($20). Cheap band degrades among themselves then Copilot;
    # premium band steps DOWN in price (sol -> terra -> luna) before leaving the paid pool.
    - zen-glm: [cod-terra, zen-qwen-plus, zen-minimax, co-sonnet]
    - zen-minimax: [cod-terra, zen-qwen-plus, zen-glm, co-sonnet]
    - zen-qwen-plus: [cod-terra, zen-glm, zen-minimax, co-sonnet]
    - zen-qwen-max: [cod-sol, zen-glm, zen-qwen-plus, co-opus]
    - zen-grok: [cod-sol, zen-luna, zen-glm, co-opus]
    - zen-kimi3: [cod-sol, zen-luna, zen-glm, co-opus]
    - zen-sol: [cod-sol, zen-terra, zen-luna, co-opus]
    - zen-terra: [cod-sol, zen-luna, zen-glm, co-opus]
    - zen-luna: [cod-terra, ant-sonnet, zen-glm, zen-qwen-plus, co-sonnet]
    # Free native reasoners (were unlisted -> would hard-error mid-stream per the note above).
    - free-ling: [free-mimo, free-deepseek, nim-glm, cod-terra, go-glm]
    - free-laguna: [free-nemotron, free-deepseek, nim-glm, cod-terra, go-glm]
    - free-mimo: [free-ling, free-deepseek, nim-glm, cod-terra, go-glm]
    - free-north: [nim-deepseek, free-deepseek, cod-terra, go-glm, co-sonnet]
    - zen-gpt: [cod-sol, go-qwen-max, go-glm, co-opus, co-sonnet]
    - zen-fable: [cod-sol, go-qwen-max, zen-opus, zen-gpt, co-opus]
    - zen-opus: [cod-sol, go-qwen-max, zen-fable, zen-gpt, co-opus]
    - co-opus: [cod-sol, go-qwen-max, go-glm, co-sonnet, co-gemini]
    - ant-fable: [cod-sol, go-qwen-max, ant-opus, ant-sonnet, zen-fable, zen-gpt, co-opus]
    - ant-sonnet: [cod-sol, go-qwen-max, zen-fable, zen-gpt, co-sonnet]
    - ant-haiku: [nim-inkling, free-nemotron, cod-terra, go-glm, ant-sonnet, co-haiku]
    - ant-opus: [cod-sol, go-qwen-max, ant-fable, ant-sonnet, zen-fable, zen-opus, zen-gpt, co-opus]
    - co-sonnet: [cod-sol, go-glm, ant-sonnet, co-opus, co-gemini]
    - co-gemini: [nim-glm, cod-terra, go-glm, ant-sonnet, co-sonnet]
    - co-haiku: [nim-inkling, free-nemotron, cod-terra, go-glm, ant-haiku]
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600        # match router timeout — no mid-think socket kills
  callbacks: priority_router.router_instance
