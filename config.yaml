  - model_name: go-kimi
    litellm_params: {model: openai/kimi-k2.7-code, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: go-minimax
    litellm_params: {model: openai/minimax-m3, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: go-qwen-max
    litellm_params: {model: openai/qwen3.7-max, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: go-qwen-plus
    litellm_params: {model: openai/qwen3.7-plus, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: go-mimo
    litellm_params: {model: openai/mimo-v2.5-pro, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: go-deepseek-flash
    litellm_params: {model: openai/deepseek-v4-flash, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  # ===== Top-layer brains (GO flat-rate, LOW quota — orchestrator/auditor only) =====
