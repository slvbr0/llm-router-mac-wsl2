# LiteLLM proxy config — llm-router mac v1
# Aliases are STABLE; underlying model IDs re-verified at build (Task 8).
# Priority: NIM (free, when responsive) -> Zen (per-token) -> Copilot (per-request).

model_list:
  # ===== NVIDIA NIM (free-tier workhorse) =====
  - model_name: nim-glm
    litellm_params: {model: openai/z-ai/glm-5.2, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-deepseek
    litellm_params: {model: openai/deepseek-ai/deepseek-v4-pro, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-deepseek-flash
    litellm_params: {model: openai/deepseek-ai/deepseek-v4-flash, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-qwen-max
    litellm_params: {model: openai/qwen/qwen3.5-397b-a17b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-qwen
    litellm_params: {model: openai/qwen/qwen3.5-122b-a10b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-minimax
    litellm_params: {model: openai/minimaxai/minimax-m3, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-nemotron
    litellm_params: {model: openai/nvidia/nemotron-3-ultra-550b-a55b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-nemotron-super
    litellm_params: {model: openai/nvidia/nemotron-3-super-120b-a12b, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-mistral
    litellm_params: {model: openai/mistralai/mistral-large-3-675b-instruct-2512, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-llama
    litellm_params: {model: openai/meta/llama-3.3-70b-instruct, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}
  - model_name: nim-step
    litellm_params: {model: openai/stepfun-ai/step-3.7-flash, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}  # sparse-MoE reasoning, tool-capable, ~1.2s, reasons NATIVELY (no param)

  # ===== Mistral free tier (LiteLLM native mistral/ -> api.mistral.ai/v1) =====
  # Capable models only (per policy: no ministral/tiny/nemo). large+codestral = non-reasoning;
  # medium+magistral = reason natively (no param — magistral reasons inline). Cost class 0 (free).
  - model_name: mist-large
    litellm_params: {model: mistral/mistral-large-latest, api_key: os.environ/MISTRAL_API_KEY}
  - model_name: mist-codestral
    litellm_params: {model: mistral/codestral-latest, api_key: os.environ/MISTRAL_API_KEY}
  - model_name: mist-medium
    litellm_params: {model: mistral/mistral-medium-latest, api_key: os.environ/MISTRAL_API_KEY}
  - model_name: mist-magistral
    litellm_params: {model: mistral/magistral-small-latest, api_key: os.environ/MISTRAL_API_KEY}

  # ===== z.ai GLM Coding Plan (flat-rate) — Anthropic-compat endpoint ONLY =====
  # The plan key 429s on the OpenAI /paas/v4 lane ("insufficient balance"); it works only via
  # /api/anthropic, so these use LiteLLM's anthropic/ provider (x-api-key + /v1/messages). Cost
  # class 1 (flat, ranked before GO). zai-52/51 reasoners take the Anthropic thinking block.
  # zai-flash = glm-4.7 (asking glm-4.5-air on this endpoint silently serves glm-4.7).
  - model_name: zai-turbo
    litellm_params: {model: anthropic/glm-5-turbo, api_base: https://api.z.ai/api/anthropic, api_key: os.environ/ZAI_API_KEY}
  - model_name: zai-52
    litellm_params: {model: anthropic/glm-5.2, api_base: https://api.z.ai/api/anthropic, api_key: os.environ/ZAI_API_KEY}
  - model_name: zai-51
    litellm_params: {model: anthropic/glm-5.1, api_base: https://api.z.ai/api/anthropic, api_key: os.environ/ZAI_API_KEY}
  - model_name: zai-flash
    litellm_params: {model: anthropic/glm-4.7, api_base: https://api.z.ai/api/anthropic, api_key: os.environ/ZAI_API_KEY}

  # ===== opencode Zen (per-token; conserve). IDs verified at build (Task 8). =====
  - model_name: zen-gpt
    litellm_params: {model: openai/gpt-5.5, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  # Frontier Claude via Zen per-token credits (the LEGITIMATE lane — no client spoofing).
  # Needs a Zen credits balance; 401 until topped up, fallbacks cover it.
  - model_name: zen-fable
    litellm_params: {model: openai/claude-fable-5, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-opus
    litellm_params: {model: openai/claude-opus-4-8, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-glm
    litellm_params: {model: openai/glm-5.2, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-deepseek
    litellm_params: {model: openai/deepseek-v4-pro, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  # ===== opencode GO subscription (flat-rate plan, /zen/go/v1 — NOT per-token credits) =====
  - model_name: zen-kimi
    litellm_params: {model: openai/kimi-k2.7-code, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-minimax
    litellm_params: {model: openai/minimax-m3, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-qwen-max
    litellm_params: {model: openai/qwen3.7-max, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-qwen-plus
    litellm_params: {model: openai/qwen3.7-plus, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-mimo
    litellm_params: {model: openai/mimo-v2.5-pro, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-deepseek-flash
    litellm_params: {model: openai/deepseek-v4-flash, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  # ===== Top-layer brains (GO flat-rate, LOW quota — orchestrator/auditor only) =====
  # grok-4.5 (~80/5h) and kimi-k3 (~140/5h) are near-frontier quality but tiny quota, so they
  # live in the ORCHESTRATOR tier (fusion conductor / auditor / committee anchor), never everyday
  # auto-routing. On a 429 the router's fallback chain drops to ant-opus/zen-glm (see tier order).
  - model_name: zen-grok
    litellm_params: {model: openai/grok-4.5, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-kimi-k3
    litellm_params: {model: openai/kimi-k3, api_base: https://opencode.ai/zen/go/v1, api_key: os.environ/ZEN_API_KEY}
  # ===== Zen PAID per-token overflow ($20 balance, /zen/v1 + ZEN_PAID_API_KEY) =====
  # Used ONLY when GO flat-rate is exhausted (fallback) or on [BOOST] escalation. NOT in the
  # health audit (probing would spend the balance) and NOT in default tiers. Cost class 2
  # (per-token) sits below GO flat (class 1), so GO is always drained first.
  # cheap band ($/1M out): minimax 1.20, qwen-plus 1.60, glm 4.40
  - model_name: zen-paid-minimax
    litellm_params: {model: openai/minimax-m3, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_PAID_API_KEY}
  - model_name: zen-paid-qwen-plus
    litellm_params: {model: openai/qwen3.7-plus, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_PAID_API_KEY}
  - model_name: zen-paid-glm
    litellm_params: {model: openai/glm-5.2, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_PAID_API_KEY}
  # premium band (boost/drift only) ($/1M out): luna 6, grok 6, qwen-max 7.50, kimi3 15, terra 15, sol 30
  - model_name: zen-paid-luna
    litellm_params: {model: openai/gpt-5.6-luna, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_PAID_API_KEY}
  - model_name: zen-paid-grok
    litellm_params: {model: openai/grok-4.5, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_PAID_API_KEY}
  - model_name: zen-paid-qwen-max
    litellm_params: {model: openai/qwen3.7-max, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_PAID_API_KEY}
  - model_name: zen-paid-kimi3
    litellm_params: {model: openai/kimi-k3, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_PAID_API_KEY}
  - model_name: zen-paid-terra
    litellm_params: {model: openai/gpt-5.6-terra, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_PAID_API_KEY}
  - model_name: zen-paid-sol
    litellm_params: {model: openai/gpt-5.6-sol, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_PAID_API_KEY}
  # Zen FREE-tier (zero-cost fallback capacity)
  - model_name: zen-free-nemotron
    litellm_params: {model: openai/nemotron-3-ultra-free, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-free-deepseek
    litellm_params: {model: openai/deepseek-v4-flash-free, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-free-pickle
    litellm_params: {model: openai/big-pickle, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-free-ling
    litellm_params: {model: openai/ling-3.0-flash-free, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-free-laguna
    litellm_params: {model: openai/laguna-s-2.1-free, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-free-mimo
    litellm_params: {model: openai/mimo-v2.5-free, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}
  - model_name: zen-free-north
    litellm_params: {model: openai/north-mini-code-free, api_base: https://opencode.ai/zen/v1, api_key: os.environ/ZEN_API_KEY}

  # ===== Anthropic Claude Max (OAuth; flat-rate Max subscription via Claude Code) =====
  # Proxied through providers/claude_oauth_proxy.py on host:4041.
  # Token read from macOS Keychain "Claude Code-credentials" (set by: claude /login).
  - model_name: ant-sonnet
    litellm_params: {model: anthropic/claude-sonnet-5, api_base: "http://host.docker.internal:4041", api_key: oauth-via-proxy}
  - model_name: ant-haiku
    litellm_params: {model: anthropic/claude-haiku-4-5-20251001, api_base: "http://host.docker.internal:4041", api_key: oauth-via-proxy}
  - model_name: ant-opus
    litellm_params: {model: anthropic/claude-opus-4-8, api_base: "http://host.docker.internal:4041", api_key: oauth-via-proxy}
  - model_name: ant-fable
    litellm_params: {model: anthropic/claude-fable-5, api_base: "http://host.docker.internal:4041", api_key: oauth-via-proxy}

  # ===== GitHub Copilot (per-request credit; frontier). Device-flow token. =====
  - model_name: cop-opus
    litellm_params: {model: github_copilot/claude-opus-4.8}
  - model_name: cop-sonnet
    litellm_params: {model: github_copilot/claude-sonnet-5}
  - model_name: cop-gpt
    litellm_params: {model: github_copilot/gpt-5.5}
  - model_name: cop-codex
    litellm_params: {model: github_copilot/gpt-5.3-codex}
  - model_name: cop-gemini
    litellm_params: {model: github_copilot/gemini-3.1-pro-preview}
  - model_name: cop-haiku
    litellm_params: {model: github_copilot/claude-haiku-4.5}
  - model_name: cop-mini
    litellm_params: {model: github_copilot/gpt-5.4-mini}

  # Router entry point — priority_router rewrites per request.
  - model_name: auto
    litellm_params: {model: openai/z-ai/glm-5.2, api_base: https://integrate.api.nvidia.com/v1, api_key: os.environ/NVIDIA_API_KEY}

# Native LiteLLM fallbacks (deployment error/rate-limit): cost-ordered NIM -> Zen -> Copilot.
router_settings:
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
  num_retries: 1              # was 2: each retry RE-SENDS the full prompt to the SAME (often
                              # rate-limited) model before falling back — billed a 63k-token brain
                              # call up to 3x. 1 keeps a transient-blip retry; a 429 falls back fast.
  timeout: 600                # reasoning models on huge contexts think LONG before streaming
  stream_timeout: 600         # never kill a stream mid-think (wait-it-out rule)
  # COMPLETE fallback map — EVERY model group has a chain (mid-stream failures on an
  # unlisted group hard-error instead of falling back; learned live on zen-free-nemotron).
  # Order per chain (marginal-cost cascade): free (NIM/Mistral/zen-free) -> z.ai flat -> GO flat
  # -> Anthropic Max flat -> PAID zen twin (last resort) -> copilot. Free ALWAYS before paid.
  fallbacks:
    # Mistral free -> peer Mistral -> free NIM -> z.ai flat -> GO -> copilot (cost-ordered).
    - mist-large: [mist-medium, mist-codestral, nim-mistral, zai-turbo, zen-glm, cop-sonnet]
    - mist-codestral: [mist-large, nim-deepseek, zai-turbo, zen-kimi, cop-sonnet]
    - mist-medium: [mist-magistral, mist-large, nim-glm, zai-52, zen-glm, ant-sonnet]
    - mist-magistral: [mist-medium, nim-glm, zai-52, zen-glm, ant-sonnet]
    # z.ai flat -> peer z.ai -> free -> GO -> Anthropic Max -> copilot.
    - zai-turbo: [zai-flash, mist-large, zen-glm, zen-kimi, cop-sonnet]
    - zai-flash: [zai-turbo, mist-codestral, zen-glm, cop-sonnet]
    - zai-52: [zai-51, mist-medium, zen-glm, zen-qwen-max, ant-sonnet, cop-opus]
    - zai-51: [zai-52, mist-medium, zen-glm, zen-qwen-max, ant-sonnet, cop-opus]
    - nim-glm: [nim-mistral, zen-free-nemotron, zen-glm, cop-sonnet]
    - nim-mistral: [nim-glm, zen-free-nemotron, zen-glm, cop-sonnet]
    - nim-deepseek: [nim-qwen, nim-deepseek-flash, zen-deepseek, cop-sonnet]
    - nim-qwen: [nim-deepseek, nim-minimax, zen-kimi, cop-sonnet]
    - nim-qwen-max: [nim-nemotron, nim-deepseek, zen-qwen-max, cop-opus]
    - nim-nemotron: [nim-qwen-max, nim-nemotron-super, zen-qwen-max, cop-opus]
    - nim-nemotron-super: [nim-nemotron, nim-qwen-max, zen-qwen-max, cop-opus]
    - nim-minimax: [nim-glm, nim-deepseek, zen-minimax, cop-sonnet]
    - nim-llama: [nim-deepseek-flash, zen-free-deepseek, zen-deepseek-flash, cop-haiku]
    - nim-step: [nim-glm, nim-deepseek, zen-free-north, zen-glm, cop-sonnet]
    - nim-deepseek-flash: [nim-llama, zen-free-deepseek, zen-deepseek-flash, cop-haiku]
    - zen-free-nemotron: [nim-glm, nim-mistral, zen-glm, cop-sonnet]
    - zen-free-deepseek: [nim-deepseek-flash, nim-llama, zen-deepseek-flash, cop-haiku]
    - zen-free-pickle: [zen-free-deepseek, nim-llama, cop-haiku]
    # GO flat models overflow FREE-FIRST. A GO 429 means the whole GO plan is saturated, so other
    # GO peers are useless — skip them. Order: free NIM/Mistral -> z.ai flat -> Anthropic Max flat
    # -> PAID twin (LAST, only if every free/flat option is down) -> copilot. Paid is NEVER reached
    # before free/flat capacity (that was billing 63k-token calls at ~$0.22 each on a saturated GO).
    - zen-glm: [nim-glm, mist-large, zai-turbo, ant-sonnet, zen-paid-glm, cop-sonnet]
    - zen-deepseek: [nim-deepseek, nim-glm, zai-turbo, ant-sonnet, cop-sonnet]
    - zen-deepseek-flash: [zen-free-deepseek, nim-deepseek-flash, nim-llama, zai-flash, cop-haiku]
    - zen-kimi: [nim-deepseek, nim-glm, zai-turbo, ant-sonnet, cop-sonnet]
    - zen-minimax: [nim-minimax, nim-glm, zai-turbo, ant-sonnet, zen-paid-minimax, cop-sonnet]
    - zen-qwen-max: [nim-qwen-max, nim-glm, zai-52, ant-sonnet, zen-paid-qwen-max, cop-opus]
    - zen-mimo: [nim-glm, mist-large, zai-turbo, ant-sonnet, cop-sonnet]
    - zen-qwen-plus: [nim-qwen-max, nim-glm, zai-52, ant-sonnet, zen-paid-qwen-plus, cop-opus]
    # Orchestrator brains (low quota): a 429 degrades FREE-FIRST (free reasoner) -> Anthropic Max
    # (quality flat) -> z.ai flat -> PAID twin LAST RESORT -> copilot. Previously paid was 1st/2nd
    # here — that is exactly what billed the 63k brain calls. grok/kimi-k3 skip each other (both
    # low-quota) and skip GO peers entirely (GO is saturated when the brain 429s).
    - zen-kimi-k3: [nim-glm, mist-medium, ant-opus, ant-sonnet, zai-52, zen-paid-kimi3, cop-opus]
    - zen-grok: [nim-glm, mist-medium, ant-opus, ant-sonnet, zai-52, zen-paid-grok, cop-opus]
    # PAID per-token overflow chains ($20). Cheap band degrades among themselves then Copilot;
    # premium band steps DOWN in price (sol -> terra -> luna) before leaving the paid pool.
    - zen-paid-glm: [zen-paid-qwen-plus, zen-paid-minimax, cop-sonnet]
    - zen-paid-minimax: [zen-paid-qwen-plus, zen-paid-glm, cop-sonnet]
    - zen-paid-qwen-plus: [zen-paid-glm, zen-paid-minimax, cop-sonnet]
    - zen-paid-qwen-max: [zen-paid-glm, zen-paid-qwen-plus, cop-opus]
    - zen-paid-grok: [zen-paid-luna, zen-paid-glm, ant-opus, cop-opus]
    - zen-paid-kimi3: [zen-paid-luna, zen-paid-glm, ant-opus, cop-opus]
    - zen-paid-sol: [zen-paid-terra, zen-paid-luna, ant-opus, cop-opus]
    - zen-paid-terra: [zen-paid-luna, zen-paid-glm, ant-opus, cop-opus]
    - zen-paid-luna: [zen-paid-glm, zen-paid-qwen-plus, ant-sonnet, cop-sonnet]
    # Free native reasoners (were unlisted -> would hard-error mid-stream per the note above).
    - zen-free-ling: [zen-free-mimo, zen-free-deepseek, nim-glm, zen-glm]
    - zen-free-laguna: [zen-free-nemotron, zen-free-deepseek, nim-glm, zen-glm]
    - zen-free-mimo: [zen-free-ling, zen-free-deepseek, nim-glm, zen-glm]
    - zen-free-north: [nim-deepseek, zen-free-deepseek, zen-glm, cop-sonnet]
    - zen-gpt: [zen-qwen-max, zen-glm, cop-opus, cop-sonnet]
    - zen-fable: [ant-opus, ant-fable, cop-opus, zen-opus, zen-gpt, zen-qwen-max]
    - zen-opus: [ant-opus, ant-fable, cop-opus, zen-fable, zen-gpt, zen-qwen-max]
    - cop-opus: [ant-opus, ant-fable, cop-sonnet, cop-gemini, zen-qwen-max, zen-glm]
    - ant-fable: [ant-opus, ant-sonnet, cop-opus, zen-fable, zen-gpt, zen-qwen-max]
    - ant-sonnet: [ant-opus, cop-sonnet, zen-fable, zen-gpt, zen-qwen-max]
    - ant-haiku: [ant-sonnet, cop-haiku, zen-glm, nim-mistral, zen-free-nemotron]
    - ant-opus: [ant-fable, ant-sonnet, cop-opus, zen-fable, zen-opus, zen-gpt, zen-qwen-max]
    - cop-sonnet: [ant-sonnet, cop-opus, cop-gemini, zen-glm]
    - cop-gemini: [ant-sonnet, cop-sonnet, zen-glm, nim-glm]
    - cop-haiku: [ant-haiku, zen-glm, nim-mistral, zen-free-nemotron]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

litellm_settings:
  drop_params: true
  set_verbose: false
  request_timeout: 600        # match router timeout — no mid-think socket kills
  callbacks: priority_router.router_instance
