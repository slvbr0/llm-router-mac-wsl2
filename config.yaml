  # Token read from macOS Keychain "Claude Code-credentials" (set by: claude /login).
  - model_name: ant-sonnet
    litellm_params: {model: anthropic/claude-sonnet-5, api_base: "http://host.docker.internal:4041", api_key: oauth-via-proxy}
  - model_name: ant-haiku
    litellm_params: {model: anthropic/claude-haiku-4-5-20251001, api_base: "http://host.docker.internal:4041", api_key: oauth-via-proxy}
  - model_name: ant-opus
    litellm_params: {model: anthropic/claude-opus-4-8, api_base: "http://host.docker.internal:4041", api_key: oauth-via-proxy}
