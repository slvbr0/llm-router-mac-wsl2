services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.90.3
    # Overridable so a second (staging) stack can run beside a live one during a cutover:
    #   LLMR_NAME=litellm-proxy-stage LLMR_DB_NAME=litellm-db-stage LLMR_PORT=4050 \
    #     docker compose -p llmr-stage up -d
    container_name: ${LLMR_NAME:-litellm-proxy}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LLMR_PORT:-4040}:4000"
    # ant-* aliases call the Claude OAuth proxy on the HOST at host.docker.internal:4041.
    # macOS (OrbStack/Docker Desktop) resolves that name natively; Linux/WSL2 Docker Engine
    # does NOT — without this mapping every ant-* request fails to connect. Harmless on macOS.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./priority_router.py:/app/priority_router.py:ro
      - ./availability.yaml:/app/availability.yaml
      - ./model_health.yaml:/app/model_health.yaml
      # Cache profile (scripts/cache_audit.sh). Read fresh per request like the health file;
      # without this mount the router sees no profile and fails open — no cache preference.
      - ./model_cache.yaml:/app/model_cache.yaml
      - ./.llmr-refresh-trigger:/app/.llmr-refresh-trigger   # router touches this after a PAID call -> host refresher re-audits free models fast
      - litellm-tokens:/app/.litellm
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm
      - STORE_MODEL_IN_DB=True
      - AVAILABILITY_CONFIG=/app/availability.yaml
      - MODEL_HEALTH_CONFIG=/app/model_health.yaml
      - MODEL_CACHE_CONFIG=/app/model_cache.yaml
      - PYTHONPATH=/app
      - GITHUB_COPILOT_TOKEN_DIR=/app/.litellm/github_copilot
      - DISABLE_AIOHTTP_TRANSPORT=True   # aiohttp socket read-timeout kills silent thinking streams; httpx respects timeouts
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    image: postgres:16-alpine
    container_name: ${LLMR_DB_NAME:-litellm-db}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=litellm
    volumes:
      - litellm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  litellm-db:
  litellm-tokens:
